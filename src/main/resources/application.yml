server:
  port: 8080

spring:
  application:
    name: tuapp-backend

  datasource:
    url: jdbc:h2:mem:tuappdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Configuración JWT
jwt:
  secret: tuClaveSecretaMuyLargaYSeguraParaFirmarTokensJWT2024
  expiration: 86400000  # 24 horas en ms